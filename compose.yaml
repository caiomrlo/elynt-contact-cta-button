services:
  wordpress:
    build: .
    container_name: elynt_wordpress
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_secret
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', true);
        define('SCRIPT_DEBUG', true);
    volumes:
      - wordpress_data:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/elynt-contact-cta-button
      - ./phpcs.xml.dist:/var/www/html/wp-content/plugins/elynt-contact-cta-button/phpcs.xml.dist
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: elynt_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress_secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_secret || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  wp-cli:
    image: wordpress:cli-php8.3
    container_name: elynt_wp_cli
    user: "33:33"
    volumes:
      - wordpress_data:/var/www/html
      - ./plugin:/var/www/html/wp-content/plugins/elynt-contact-cta-button
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress_secret
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      wordpress:
        condition: service_started
      db:
        condition: service_healthy
    restart: "no"
    entrypoint: |
      /bin/sh -c "
      echo 'Aguardando inicializacao dos arquivos do WordPress...'
      while [ ! -f /var/www/html/wp-config.php ]; do
        sleep 2
      done
      echo 'Verificando instalacao do WordPress...'
      if ! wp core is-installed --path=/var/www/html; then
        echo 'Instalando WordPress automaticamente...'
        wp core install --path=/var/www/html --url=http://localhost:8080 --title='Elynt Plugin Dev' --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
      fi
      echo 'Ativando plugin elynt-contact-cta-button...'
      wp plugin activate elynt-contact-cta-button --path=/var/www/html || true
      echo 'Ambiente pronto! Acesse http://localhost:8080/wp-admin/'
      "

volumes:
  wordpress_data:
  db_data:
